[package]
name = "zediator"
version = "0.1.0"
edition = "2024"
description = "Mediator between Zed terminal sessions and AI agent CLIs"
repository = "https://github.com/handlename/zediator"
license = "MIT"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
libc = "0.2.186"
portable-pty = "0.9.0"
regex = "1.12.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
signal-hook = "0.4.4"
tempfile = "3.27.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
vte = "0.15.0"

[lints.clippy]
all = { level = "warn", priority = -1 }
